# bae6-context MCP gateway on the bae6-platform `bae6-service` chart. Replicas are
# interchangeable and keep no state; each call is a fresh upstream session.
# helm install bae6-context-mcp-gateway <bae6-platform checkout>/charts/bae6-service \
#   -f deploy/mcp-gateway.values.yaml --set image.digest=sha256:...
image:
  repository: ghcr.io/basics-only/bae6-context-mcp-gateway

replicas: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 6

# Drain delay (10 s) + main.ts hard exit (BAE6_REQUEST_TIMEOUT_MS 30 s + 5 s) + margin, so
# main.ts, not SIGKILL, ends shutdown.
terminationGracePeriodSeconds: 60

env:
  BAE6_SHUTDOWN_DELAY_MS: "10000"
  BAE6_MAX_INFLIGHT: "32"
  BAE6_MAX_INFLIGHT_PER_ORGANIZATION: "16"
  # A call runs at most this long; also the longest an approval takes to stop being used
  # beyond the cache TTL.
  BAE6_MCP_CALL_TIMEOUT_MS: "20000"
  # Revocation in the registry reaches callers within this long (ADR 0006).
  BAE6_MCP_CACHE_TTL_MS: "30000"
  BAE6_MCP_REGISTRY_URL: http://bae6-context-mcp-registry
  # Calls may only reach hosts under these suffixes. Required.
  # Comma-separated domains, no leading dot: example.com allows example.com and *.example.com.
  BAE6_MCP_ALLOWED_HOST_SUFFIXES: example.invalid
  BAE6_MCP_ISSUERS: >-
    [{"issuer":"https://idp.example.invalid/","audience":"bae6-context-mcp-gateway","jwksUri":"https://idp.example.invalid/.well-known/jwks.json","organization":"example","application":"example-app"}]

# Secrets are named here and read from the environment; never inline them. They are read once
# at start, so rotating one needs a rollout. The registry tokens they lead to are fetched and
# renewed at runtime.
envFromSecrets:
  # JSON object of organization to {tokenUrl,clientId,clientSecret,scope?}: a client-credentials
  # client whose tokens carry `mcp:discover` for that organization's registry. Organizations
  # not listed cannot invoke anything.
  - name: BAE6_MCP_REGISTRY_CREDENTIALS
    secret: bae6-context-mcp-gateway
    key: registry-credentials

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

networkPolicy:
  egress:
    # The registry service, the identity provider's JWKS and the approved servers; narrow per
    # target. Unauthenticated servers are reachable by every holder of `mcp:invoke`, so keep
    # this to the destinations you mean to expose.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 80
        - port: 443
