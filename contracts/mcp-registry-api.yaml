openapi: 3.1.0
info:
  title: bae6-context MCP registry API
  version: 1.0.0
  summary: Tenant-scoped catalog of independently owned MCP servers, with publication, approval and revocation.
  description: |
    The registry is a control plane. It records which servers an organization has published
    and approved; it never proxies calls, never stores access tokens, and is not on the path
    of a client that already talks to a server directly.

    **Identity.** The workload is identified by its bearer token. The organization comes from
    the token issuer's configuration, never from claims or bodies. Three independent scopes:
    `mcp:publish` (register servers and versions), `mcp:approve` (approve and revoke) and
    `mcp:discover` (read). Approval does not grant invocation: whoever calls a listed server
    must be authorized by that server, and by the caller's own policy, at the time of the call.

    **Tenancy.** A server of another organization is `404 not_found`, the same as one that
    does not exist.

    **Lifecycle.** A version is `pending` when published. `approve` makes it `approved`;
    `revoke` makes it `revoked` for good, from either state. A repeated transition to the
    state a version is already in succeeds without change; any other transition is
    `409 conflict`. Approved versions are immutable, and a revoked version cannot return:
    publish a new version.

    **Discovery.** Callers with only `mcp:discover` see approved versions, and servers with
    none are `404`. Callers holding `mcp:publish` or `mcp:approve` also see pending and
    revoked versions so they can manage them.

    **Endpoints.** Endpoint URIs must be `https`, name a host (never an IP literal), carry no
    credentials or fragment, and match the operator's egress policy. The registry connects to
    an endpoint only for the health check, resolves it to public addresses only, does not
    follow redirects, and fails closed.

    **Audit.** Publication, approval and revocation are recorded as audit events in the same
    transaction as the change.

    **Limits.** Over-limit requests are refused, never clamped. Bodies are at most 64 KiB.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearer: []
paths:
  /health/live:
    $ref: "./vendor/openapi/common.yaml#/paths/~1health~1live"
  /health/ready:
    $ref: "./vendor/openapi/common.yaml#/paths/~1health~1ready"
  /v1/servers:
    post:
      operationId: createServer
      summary: Registers a server with its first version. Needs `mcp:publish`.
      description: |
        The version starts `pending`. Registering an ID that exists in the organization is
        `409 conflict`; add a version instead.
      parameters:
        - $ref: "#/components/parameters/EndUserToken"
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: The registered server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "./vendor/openapi/common.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "./vendor/openapi/common.yaml#/components/responses/PayloadTooLarge"
        "429":
          $ref: "./vendor/openapi/common.yaml#/components/responses/RateLimited"
        "503":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unavailable"
    get:
      operationId: listServers
      summary: The organization's servers, by ID. Needs a registry scope.
      parameters:
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/Cursor"
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/Limit"
        - $ref: "#/components/parameters/EndUserToken"
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: One page of servers visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerPage"
        "400":
          $ref: "./vendor/openapi/common.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Forbidden"
        "429":
          $ref: "./vendor/openapi/common.yaml#/components/responses/RateLimited"
        "503":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unavailable"
  /v1/servers/{serverId}:
    get:
      operationId: getServer
      summary: One server and the versions visible to the caller. Needs a registry scope.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/EndUserToken"
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./vendor/openapi/common.yaml#/components/responses/NotFound"
        "429":
          $ref: "./vendor/openapi/common.yaml#/components/responses/RateLimited"
        "503":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unavailable"
  /v1/servers/{serverId}/versions:
    post:
      operationId: createVersion
      summary: Publishes a new `pending` version. Needs `mcp:publish`.
      description: |
        A version string is published once. At most 50 versions per server.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/EndUserToken"
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "201":
          description: The server with the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "./vendor/openapi/common.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./vendor/openapi/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "./vendor/openapi/common.yaml#/components/responses/PayloadTooLarge"
        "429":
          $ref: "./vendor/openapi/common.yaml#/components/responses/RateLimited"
        "503":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unavailable"
  /v1/servers/{serverId}/approve:
    post:
      operationId: approveVersion
      summary: Approves a pending version. Needs `mcp:approve`.
      description: |
        The approver cannot also be the version's publisher. `scanStatus` records the result
        of the operator's own scan; the registry runs none, so it is recorded as given.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/EndUserToken"
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: The server with the approved version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "./vendor/openapi/common.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./vendor/openapi/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "./vendor/openapi/common.yaml#/components/responses/PayloadTooLarge"
        "429":
          $ref: "./vendor/openapi/common.yaml#/components/responses/RateLimited"
        "503":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unavailable"
  /v1/servers/{serverId}/revoke:
    post:
      operationId: revokeVersion
      summary: Revokes one version, or every version when `version` is absent. Needs `mcp:approve`.
      description: |
        Revocation takes effect for the next discovery call. It cannot be undone.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/EndUserToken"
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/RequestId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: The server with its revoked versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "./vendor/openapi/common.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./vendor/openapi/common.yaml#/components/responses/NotFound"
        "413":
          $ref: "./vendor/openapi/common.yaml#/components/responses/PayloadTooLarge"
        "429":
          $ref: "./vendor/openapi/common.yaml#/components/responses/RateLimited"
        "503":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unavailable"
  /v1/servers/{serverId}/health:
    get:
      operationId: getServerHealth
      summary: Whether an approved version's endpoint answers as declared. Needs `mcp:discover`.
      description: |
        Probes the version's endpoint, or the latest approved version's when `version` is
        absent: one bounded request that follows no redirects. For `oauth2` servers it also
        requires the endpoint's protected-resource metadata to name the declared `resource`.
        A result newer than 30 seconds is returned instead of probing again. Only approved
        versions are probed; others are `404`.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - name: version
          in: query
          schema:
            $ref: "#/components/schemas/VersionName"
        - $ref: "#/components/parameters/EndUserToken"
        - $ref: "./vendor/openapi/common.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The probe result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerHealth"
        "400":
          $ref: "./vendor/openapi/common.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./vendor/openapi/common.yaml#/components/responses/NotFound"
        "429":
          $ref: "./vendor/openapi/common.yaml#/components/responses/RateLimited"
        "503":
          $ref: "./vendor/openapi/common.yaml#/components/responses/Unavailable"
components:
  securitySchemes:
    bearer:
      $ref: "./vendor/openapi/common.yaml#/components/securitySchemes/bearer"
  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ServerId"
    EndUserToken:
      name: Bae6-End-User-Token
      in: header
      description: Optional verified user token; the user becomes the subject.
      schema:
        type: string
        maxLength: 8192
  responses:
    Conflict:
      description: The request conflicts with the stored state.
      headers:
        X-Request-Id:
          $ref: "./vendor/openapi/common.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "./vendor/openapi/common.yaml#/components/schemas/ErrorEnvelope"
  schemas:
    ServerId:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
    VersionName:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$"
    Name:
      type: string
      minLength: 1
      maxLength: 128
    Slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    Capability:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024
    Authentication:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method:
          description: |
            `oauth2` servers are protected resources: `resource` is the audience their tokens
            must carry, and callers must not pass tokens meant for other services to them.
          type: string
          enum: [oauth2, none]
        resource:
          description: Required with `oauth2`, absent with `none`. An https URI.
          type: string
          maxLength: 2048
        requiredScopes:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: "^[\\x21\\x23-\\x5B\\x5D-\\x7E]{1,128}$"
    VersionInput:
      allOf:
        - $ref: "#/components/schemas/VersionBody"
      unevaluatedProperties: false
    VersionBody:
      description: |
        `tools`, `resources` and `prompts` list what the server declares; names are unique
        within each list. With `oauth2`, `resource` must share the endpoint's origin.
      type: object
      required: [version, endpoint, protocolVersion, transport, authentication]
      properties:
        version:
          $ref: "#/components/schemas/VersionName"
        endpoint:
          type: string
          maxLength: 2048
        protocolVersion:
          description: The MCP specification revision the server implements, e.g. `2025-06-18`.
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        transport:
          type: string
          enum: [streamable-http]
        authentication:
          $ref: "#/components/schemas/Authentication"
        tools:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Capability"
        resources:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Capability"
        prompts:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Capability"
        allowedNetworkZones:
          description: Zones the operator allows to call this server. Empty means none.
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Slug"
    CreateServerRequest:
      type: object
      required: [id, team, name, version]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ServerId"
        team:
          description: The owning team within the organization.
          $ref: "#/components/schemas/Slug"
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024
        version:
          $ref: "#/components/schemas/VersionInput"
    ApproveRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          $ref: "#/components/schemas/VersionName"
        scanStatus:
          type: string
          enum: [unscanned, clean]
          default: unscanned
    RevokeRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          $ref: "#/components/schemas/VersionName"
    Version:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/VersionBody"
        - type: object
          required: [state, scanStatus, publishedBy, publishedAt]
          properties:
            state:
              type: string
              enum: [pending, approved, revoked]
            scanStatus:
              type: string
              enum: [unscanned, clean]
            publishedBy:
              type: string
            publishedAt:
              type: string
              format: date-time
            decidedBy:
              description: Who approved or revoked. Absent while `pending`.
              type: string
            decidedAt:
              type: string
              format: date-time
    Server:
      type: object
      required: [id, organization, team, name, versions, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ServerId"
        organization:
          $ref: "#/components/schemas/Slug"
        team:
          $ref: "#/components/schemas/Slug"
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        versions:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Version"
    ServerPage:
      allOf:
        - $ref: "./vendor/openapi/common.yaml#/components/schemas/Page"
        - type: object
          properties:
            items:
              items:
                $ref: "#/components/schemas/Server"
    ServerHealth:
      type: object
      required: [version, status, checkedAt]
      additionalProperties: false
      properties:
        version:
          $ref: "#/components/schemas/VersionName"
        status:
          type: string
          enum: [healthy, unhealthy]
        checkedAt:
          type: string
          format: date-time
        reason:
          description: Present when `unhealthy`; a short fixed code, never the server's own text.
          type: string
          enum:
            - endpoint_blocked
            - unreachable
            - timeout
            - bad_status
            - redirected
            - resource_mismatch
            - invalid_metadata
